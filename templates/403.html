{% extends 'base.html' %}

{% block title %}Access Denied (403) | Hometrace{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4 py-16">
  <div class="max-w-md w-full text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m11-3.5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <span class="text-xs font-bold uppercase tracking-wider text-rose-600">403 Forbidden</span>
    <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Access Restricted</h1>
    <p class="text-sm text-slate-600 mt-2">You do not have the required role privileges to access this page or administrative portal.</p>
    <div class="mt-6">
      <a href="{% url 'home' %}" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm shadow hover:bg-slate-800 transition-colors">
        Return to Safety
      </a>
    </div>
  </div>
</div>
{% endblock %}
