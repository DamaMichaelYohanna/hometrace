{% extends 'base.html' %}

{% block title %}System Error (500) | Hometrace{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4 py-16">
  <div class="max-w-md w-full text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    <span class="text-xs font-bold uppercase tracking-wider text-rose-600">500 Server Error</span>
    <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Something went wrong</h1>
    <p class="text-sm text-slate-600 mt-2">Our technical team has been notified. Please try refreshing the page or returning home.</p>
    <div class="mt-6">
      <a href="{% url 'home' %}" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm shadow hover:bg-slate-800 transition-colors">
        Return to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
