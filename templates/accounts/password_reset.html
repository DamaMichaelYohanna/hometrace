{% extends 'base.html' %}

{% block title %}Reset Password | Hometrace Nigeria{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[75vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
    
    <div class="w-12 h-12 mx-auto rounded-2xl bg-teal-50 text-brand-teal flex items-center justify-center mb-4">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Forgot Password?</h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-1 mb-6">Enter your registered email address and we will dispatch recovery instructions.</p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div class="text-left">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="you@domain.com" class="form-input text-sm">
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-teal hover:bg-teal-700 text-white font-bold text-sm shadow transition-colors">
        Send Reset Instructions
      </button>

      <p class="text-xs text-slate-500 pt-2">
        Remembered your password? 
        <a href="{% url 'login' %}" class="font-bold text-brand-teal hover:underline ml-1">Sign In</a>
      </p>
    </form>

  </div>
</div>
{% endblock %}
