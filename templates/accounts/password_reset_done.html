{% extends 'base.html' %}

{% block title %}Reset Instructions Sent | Hometrace Nigeria{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[75vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
    
    <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Instructions Dispatched</h1>
    <p class="text-sm text-slate-600 mt-2 leading-relaxed">
      If an account exists for <strong class="text-slate-900">{{ email }}</strong>, an email containing your password reset link has been dispatched.
    </p>

    <div class="mt-8">
      <a href="{% url 'login' %}" class="inline-block w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-sm shadow hover:bg-slate-800 transition-colors">
        Return to Login
      </a>
    </div>

  </div>
</div>
{% endblock %}
