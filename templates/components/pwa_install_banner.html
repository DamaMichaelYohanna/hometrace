{% load static %}
<div id="pwa-install-banner" class="hidden fixed bottom-16 md:bottom-6 left-4 right-4 md:left-auto md:right-6 md:max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200/90 p-4 z-50 transition-all">
  <div class="flex items-center space-x-3.5">
    
    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-navy to-brand-teal flex items-center justify-center text-white flex-shrink-0 shadow-md">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </div>

    <div class="flex-1">
      <h4 class="text-sm font-bold text-slate-900 leading-tight">Install Hometrace App</h4>
      <p class="text-xs text-slate-500 mt-0.5 leading-snug">Fast home screen access and instant property alerts.</p>
    </div>

    <button onclick="document.getElementById('pwa-install-banner').remove()" class="text-slate-400 hover:text-slate-600 p-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>

  </div>

  <div class="mt-3.5 flex items-center space-x-2">
    <button onclick="triggerPwaInstall()" class="flex-1 py-2 px-3 rounded-xl bg-brand-teal hover:bg-teal-700 text-white font-bold text-xs shadow-sm transition-colors flex items-center justify-center space-x-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      <span>Install Now</span>
    </button>
    <button onclick="document.getElementById('pwa-install-banner').remove()" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-colors">
      Later
    </button>
  </div>
</div>
