{% extends 'base.html' %}
{% load static %}

{% block title %}Offline Fallback | Hometrace{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="max-w-md w-full text-center">
    
    <div class="w-20 h-20 mx-auto rounded-3xl bg-amber-50 border border-amber-200/80 flex items-center justify-center text-amber-600 mb-6 shadow-sm">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-15.536a9 9 0 0112.728 0"/></svg>
    </div>

    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">You're Currently Offline</h1>
    <p class="mt-3 text-slate-600 text-sm leading-relaxed">
      You can view previously cached pages. Live property search, messaging, and payments require an internet connection.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <button onclick="window.location.reload()" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-brand-teal hover:bg-teal-700 text-white font-bold text-sm shadow-md transition-colors flex items-center justify-center space-x-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span>Retry Connection</span>
      </button>
      <a href="{% url 'home' %}" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm transition-colors">
        Return Home
      </a>
    </div>

  </div>
</div>
{% endblock %}
