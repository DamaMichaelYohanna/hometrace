{% extends 'base.html' %}

{% block title %}Payment Failed | Hometrace Nigeria{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[75vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
    
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>

    <span class="text-xs font-bold uppercase tracking-wider text-rose-600">Transaction Failed</span>
    <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Payment Unsuccessful</h1>
    <p class="text-sm text-slate-600 mt-2">
      Your payment for reference <strong class="font-mono text-slate-800">{{ payment.reference }}</strong> could not be verified or was declined by your bank.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="{% url 'payment_checkout' %}?purpose={{ payment.purpose }}" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-brand-teal text-white font-bold text-xs shadow hover:bg-teal-700 transition-colors">
        Try Again
      </a>
      <a href="{% url 'payment_history' %}" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs hover:bg-slate-200 transition-colors">
        View History
      </a>
    </div>

  </div>
</div>
{% endblock %}
