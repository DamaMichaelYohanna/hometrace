{% extends 'base.html' %}

{% block title %}Confirm Deletion: {{ property.title }} | Hometrace{% endblock %}

{% block content %}
<div class="py-16 bg-slate-50 min-h-[75vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
    
    <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Delete Property?</h1>
    <p class="text-sm text-slate-600 mt-2">
      Are you sure you want to delete <strong class="text-slate-900">"{{ property.title }}"</strong>? This action cannot be reversed.
    </p>

    <form method="POST" class="mt-8 flex items-center justify-center space-x-3">
      {% csrf_token %}
      <a href="{% url 'agent_properties' %}" class="w-1/2 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-colors">
        Cancel
      </a>
      <button type="submit" class="w-1/2 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow transition-colors">
        Confirm Delete
      </button>
    </form>

  </div>
</div>
{% endblock %}
